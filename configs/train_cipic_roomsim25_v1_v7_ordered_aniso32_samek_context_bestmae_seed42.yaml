dataset:
  root_dir: "/disk2/bywang/DOA-net/data/librispeech_cipic_roomsim25_v1/train"
  train_root: "/disk2/bywang/DOA-net/data/librispeech_cipic_roomsim25_v1/train"
  val_root: "/disk2/bywang/DOA-net/data/librispeech_cipic_roomsim25_v1/val"
  test_root: "/disk2/bywang/DOA-net/data/librispeech_cipic_roomsim25_v1/test"
  sample_rate: 16000
  segment_seconds: 2.0
  split_seed: 42

feature:
  n_fft: 512
  hop_length: 160
  win_length: 400
  window: "hann"

model:
  type: "native_lite_v7_dual_cue_concat"
  encoder_variant: "v2_balanced"
  content_encoder_type: "shared_2dcnn"
  content_input_mode: "logmag"
  encoder_channels: [24, 40, 64]
  encoder_out_dim: 96
  content_relation_mode: "mean_diff_absdiff"
  content_fusion_dim: 80
  lite_cue_bands: 32
  cue_band_mode: "uniform"
  lite_cue_hidden_dim: 48
  cue_value_out_dim: 24
  cue_reliability_out_dim: 8
  cue_ild_out_dim: 8
  cue_ipd_out_dim: 16
  cue_branch_mode: "cue_specific_local_tf"
  cue_specific_local_hidden_channels: 8
  cue_specific_local_ild_scale_db: 20.0
  cue_specific_local_ild_clip_db: 40.0
  cue_specific_local_use_coherence_context: true
  cue_specific_local_use_standalone_coherence: false
  cue_specific_local_block_type: "anisotropic_residual"
  cue_specific_local_ild_spectral_kernel_size: 3
  cue_specific_local_ipd_spectral_kernel_size: 3
  lite_cue_kernel_size: 3
  lite_cue_encoder_type: "temporal_conv"
  dual_cue_fusion_mode: "concat"
  disable_reliability_branch: false
  disable_content_stream: false
  use_cross_ear_interaction: false
  temporal_encoder_type: "gru"
  temporal_aggregation_type: "attention"
  gru_hidden_size: 80
  gru_num_layers: 1
  gru_dropout: 0.1
  num_classes: 25
  azimuth_range: [-180, 180]
  class_angles_deg: [-80, -65, -55, -45, -40, -35, -30, -25, -20, -15, -10, -5, 0, 5, 10, 15, 20, 25, 30, 35, 40, 45, 55, 65, 80]
  dropout: 0.2
  use_front_back_auxiliary: false
  use_attention_pooling: true
  use_regression: false
  use_pure_regression: false

train:
  batch_size: 64
  num_workers: 8
  epochs: 100
  lr: 0.0005
  weight_decay: 0.0001
  label_smoothing: 0.1
  scheduler: "cosine"
  cosine_T_max: 100
  cosine_eta_min: 0.00001
  amp: false
  device: "cuda:0"
  grad_clip: 1.0
  anti_confusion_weight: 0.0
  circular_soft_label_weight: 0.0
  front_back_aux_weight: 0.0
  front_back_focus_weight: 0.0
  expected_angle_distance_weight: 0.0
  frame_aux_weight: 0.0
  log_interval: 20
  val_interval: 1
  early_stopping_metric: "mae"
  early_stopping_patience: 15
  early_stopping_min_delta: 0.01

output:
  save_dir: "outputs/checkpoints_cipic_roomsim25_v1_v7_ordered_aniso32_samek_context_bestmae_seed42"
  log_dir: "outputs/logs_cipic_roomsim25_v1_v7_ordered_aniso32_samek_context_bestmae_seed42"

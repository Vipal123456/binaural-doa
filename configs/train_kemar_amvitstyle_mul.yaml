dataset:
  dataset_type: "static"
  sample_rate: 16000
  segment_seconds: 2.0
  root_dir: "/disk2/bywang/DOA-net/data/kemar_sofamyroom/train_20h_minimal/train"
  train_root: "/disk2/bywang/DOA-net/data/kemar_sofamyroom/train_20h_minimal/train"
  val_root: "/disk2/bywang/DOA-net/outputs/kemar_sofamyroom_dataset_val_4h/val"
  test_root: "/disk2/bywang/DOA-net/outputs/kemar_sofamyroom_dataset_test_grid/test"
  split_seed: 42

feature:
  n_fft: 512
  hop_length: 160
  win_length: 400
  window: "hann"

model:
  type: "amvit_style_baseline"
  favit_time_bins: 16
  favit_num_patches: 16
  favit_embed_dim: 64
  favit_depth: 4
  favit_num_heads: 4
  favit_mlp_ratio: 4.0
  amvit_modulation_type: "mul"
  amvit_modulation_hidden_dim: 128
  amvit_classifier_hidden_dims: [512, 256, 100]
  num_classes: 72
  azimuth_range: [-180, 180]
  dropout: 0.1
  use_front_back_auxiliary: true

train:
  batch_size: 64
  num_workers: 8
  epochs: 100
  lr: 0.0005
  weight_decay: 0.0001
  label_smoothing: 0.1
  scheduler: "cosine"
  cosine_T_max: 100
  cosine_eta_min: 0.00001
  amp: false
  device: "cuda"
  grad_clip: 1.0
  anti_confusion_weight: 0.0
  circular_soft_label_weight: 0.0
  front_back_aux_weight: 0.3
  log_interval: 50
  val_interval: 1
  early_stopping_patience: 15

output:
  save_dir: "outputs/checkpoints_kemar_amvitstyle_mul"
  log_dir: "outputs/logs_kemar_amvitstyle_mul"

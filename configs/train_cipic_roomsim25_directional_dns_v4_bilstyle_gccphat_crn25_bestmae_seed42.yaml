dataset:
  dataset_type: "static"
  root_dir: "/disk2/bywang/DOA-net/data/librispeech_cipic_roomsim25_directional_dns_v4/train"
  train_root: "/disk2/bywang/DOA-net/data/librispeech_cipic_roomsim25_directional_dns_v4/train"
  val_root: "/disk2/bywang/DOA-net/data/librispeech_cipic_roomsim25_directional_dns_v4/val"
  test_root: "/disk2/bywang/DOA-net/data/librispeech_cipic_roomsim25_directional_dns_v4/test"
  sample_rate: 16000
  segment_seconds: 2.0
  split_seed: 42

feature:
  n_fft: 512
  hop_length: 160
  win_length: 400
  window: "hann"

model:
  type: "bil_style_gccphat_crn_72cls"
  bil_gcc_bins: 64
  bil_cnn_channels: [128, 128, 128]
  bil_f_pool_size: [2, 2, 2]
  bil_t_pool_size: [1, 1, 1]
  bil_kernel_size: [3, 3]
  bil_gru_hidden_size: 128
  bil_gru_num_layers: 2
  bil_bidirectional: false
  bil_mlp_hidden_size: 128
  num_classes: 25
  azimuth_range: [-180, 180]
  class_angles_deg: [-80, -65, -55, -45, -40, -35, -30, -25, -20, -15, -10, -5, 0, 5, 10, 15, 20, 25, 30, 35, 40, 45, 55, 65, 80]
  dropout: 0.0
  use_front_back_auxiliary: false

train:
  batch_size: 64
  num_workers: 8
  epochs: 100
  lr: 0.0005
  weight_decay: 0.0001
  label_smoothing: 0.1
  scheduler: "cosine"
  cosine_T_max: 100
  cosine_eta_min: 0.00001
  amp: true
  device: "cuda:0"
  grad_clip: 1.0
  anti_confusion_weight: 0.0
  circular_soft_label_weight: 0.0
  front_back_aux_weight: 0.0
  front_back_focus_weight: 0.0
  frame_aux_weight: 0.0
  log_interval: 50
  val_interval: 1
  early_stopping_metric: "mae"
  early_stopping_patience: 15
  early_stopping_min_delta: 0.01

output:
  save_dir: "outputs/checkpoints_cipic_roomsim25_directional_dns_v4_bilstyle_gccphat_crn25_bestmae_seed42"
  log_dir: "outputs/logs_cipic_roomsim25_directional_dns_v4_bilstyle_gccphat_crn25_bestmae_seed42"

dataset:
  root_dir: /disk2/bywang/DOA-net/data/librispeech_cipic_multisubject_static_hybridbrir_gate2_50h_v1/train_subjects
  dataset_type: static
  sample_rate: 16000
  segment_seconds: 2.0
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15
  split_seed: 42
  train_root: /disk2/bywang/DOA-net/data/librispeech_cipic_multisubject_static_hybridbrir_gate2_50h_v1/train_subjects
  val_root: /disk2/bywang/DOA-net/data/librispeech_cipic_multisubject_static_hybridbrir_gate2_50h_v1/val_subjects
  test_root: /disk2/bywang/DOA-net/data/librispeech_cipic_multisubject_static_hybridbrir_gate2_50h_v1/test_subjects_unseen

feature:
  n_fft: 512
  hop_length: 160
  win_length: 400
  window: hann

model:
  type: native_lite_v7_dual_cue_concat
  encoder_channels: [24, 40, 64]
  encoder_out_dim: 96
  encoder_variant: v2_balanced
  content_input_mode: logmag
  content_relation_mode: mean_diff_absdiff
  content_fusion_dim: 80
  lite_cue_bands: 16
  lite_cue_hidden_dim: 48
  lite_cue_kernel_size: 3
  lite_cue_encoder_type: temporal_conv
  cue_value_out_dim: 24
  cue_reliability_out_dim: 8
  dual_cue_fusion_mode: concat
  dual_cue_use_tf_mask: false
  dual_cue_tf_mask_hidden_channels: 8
  dual_cue_tf_mask_residual_scale: 1.0
  temporal_head_type: gru_mul_mlp
  temporal_mlp_hidden_dim: 128
  temporal_mlp_num_layers: 2
  temporal_encoder_type: gru
  gru_hidden_size: 128
  gru_num_layers: 2
  gru_dropout: 0.2
  num_classes: 72
  azimuth_range: [-180, 180]
  dropout: 0.2
  use_attention_pooling: false
  use_front_back_auxiliary: true
  use_regression: false
  use_pure_regression: false

train:
  batch_size: 64
  num_workers: 8
  epochs: 100
  lr: 0.0005
  weight_decay: 0.0001
  label_smoothing: 0.1
  scheduler: cosine
  step_size: 30
  step_gamma: 0.1
  cosine_T_max: 100
  cosine_eta_min: 0.00001
  amp: false
  device: cuda
  grad_clip: 1.0
  anti_confusion_weight: 0.0
  circular_soft_label_weight: 0.0
  circular_kappa: 4.0
  front_back_aux_weight: 0.3
  front_back_focus_weight: 0.0
  front_back_focus_window_deg: 20.0
  log_interval: 50
  val_interval: 1
  early_stopping_patience: 15

output:
  save_dir: outputs/checkpoints_static_hybridbrir_gate2_50h_v1_v7_dualcue_grumul_mlp
  log_dir: outputs/logs_static_hybridbrir_gate2_50h_v1_v7_dualcue_grumul_mlp

# ==============================================================================
# LibriSpeech + CIPIC(subject_003) 训练配置（白噪声 SNR=10dB）
# ==============================================================================

dataset:
  root_dir: "/disk2/bywang/DOA-net/data/librispeech_cipic_subject003"
  sample_rate: 16000
  segment_seconds: 2.0
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15
  split_seed: 42
  dataset_type: "static"

  # 白噪声注入配置
  add_white_noise: true
  white_noise_snr_db: 10.0
  white_noise_prob: 1.0
  white_noise_splits: ["train", "val", "test"]

feature:
  n_fft: 512
  hop_length: 160
  win_length: 400
  window: "hann"

model:
  encoder_channels: [32, 64, 128]
  encoder_out_dim: 128
  proj_dim: 128
  prior_hidden_dim: 256
  prior_out_dim: 128
  attention_dim: 128
  num_heads: 4
  gate_dim: 128
  use_gating: true
  gru_hidden_size: 128
  gru_num_layers: 2
  gru_dropout: 0.1
  num_classes: 72
  azimuth_range: [-180, 180]
  dropout: 0.2

train:
  batch_size: 32
  num_workers: 4
  epochs: 100
  lr: 0.001
  weight_decay: 0.0001
  label_smoothing: 0.1

  scheduler: "cosine"
  cosine_T_max: 100
  cosine_eta_min: 0.00001

  amp: true
  device: "cuda"
  grad_clip: 5.0
  log_interval: 50
  val_interval: 1

output:
  save_dir: "outputs/checkpoints_librispeech_subject003_white10"
  log_dir: "outputs/logs_librispeech_subject003_white10"

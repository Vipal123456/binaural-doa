dataset:
  root_dir: data/kemar_sofamyroom/train_20h_minimal_diffusefg/train
  dataset_type: static
  sample_rate: 16000
  segment_seconds: 2.0
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15
  split_seed: 42
  train_root: data/kemar_sofamyroom/train_20h_minimal_diffusefg/train
  val_root: data/kemar_sofamyroom/val_4h_diffusefg_officialsplit/val
  test_root: data/kemar_sofamyroom_diffusefg_static_v1_test_officialsplit/test

feature:
  n_fft: 512
  hop_length: 160
  win_length: 400
  window: hann

model:
  type: native_lite_v7_dual_cue_concat
  encoder_channels: [16, 24, 32]
  encoder_out_dim: 64
  encoder_variant: v2_balanced
  content_encoder_type: lite_v1
  content_input_mode: logmag
  content_relation_mode: mean_diff_absdiff
  content_fusion_dim: 80
  lite_cue_bands: 16
  lite_cue_hidden_dim: 48
  cue_value_out_dim: 24
  cue_reliability_out_dim: 8
  lite_cue_kernel_size: 3
  lite_cue_encoder_type: temporal_conv
  dual_cue_fusion_mode: concat
  dual_cue_use_tf_mask: false
  dual_cue_tf_mask_hidden_channels: 8
  dual_cue_tf_mask_residual_scale: 1.0
  use_cross_ear_interaction: false
  bil_gcc_bins: 64
  bil_cnn_channels: [32, 64, 96]
  bil_f_pool_size: [2, 2, 2]
  bil_t_pool_size: [1, 1, 1]
  bil_kernel_size: [3, 3]
  bil_gru_hidden_size: 96
  bil_gru_num_layers: 1
  bil_bidirectional: true
  bil_mlp_hidden_size: 128
  cue_bands: 32
  cue_hidden_dim: 64
  fusion_dim: 160
  proj_dim: 128
  prior_hidden_dim: 256
  prior_out_dim: 128
  attention_dim: 128
  num_heads: 4
  gate_dim: 128
  use_gating: true
  temporal_encoder_type: gru
  mamba_num_layers: 2
  mamba_state_dim: 16
  mamba_expand_factor: 2
  mamba_conv_kernel: 4
  gru_hidden_size: 80
  gru_num_layers: 1
  gru_dropout: 0.1
  num_classes: 72
  azimuth_range: [-180, 180]
  dropout: 0.2
  use_front_back_auxiliary: true
  use_simple_binaural_fusion: false
  use_simple_cross_attention: false
  use_raw_ipd: true
  use_attention_pooling: true
  use_regression: false
  use_pure_regression: false

train:
  batch_size: 64
  num_workers: 8
  epochs: 100
  lr: 0.0005
  weight_decay: 0.0001
  label_smoothing: 0.1
  scheduler: cosine
  step_size: 30
  step_gamma: 0.1
  cosine_T_max: 100
  cosine_eta_min: 1.0e-05
  amp: false
  device: cuda:4
  grad_clip: 1.0
  anti_confusion_weight: 0.0
  circular_soft_label_weight: 0.0
  circular_kappa: 4.0
  front_back_aux_weight: 0.3
  front_back_focus_weight: 0.0
  front_back_focus_window_deg: 20.0
  log_interval: 50
  val_interval: 1
  early_stopping_patience: 15
  early_stopping_metric: accuracy
  early_stopping_min_delta: 0.0001

output:
  save_dir: outputs/checkpoints_kemar_v7_dualcue_liteenc_v1_diffusefg_officialsplit_bestacc_seed42_g4
  log_dir: outputs/logs_kemar_v7_dualcue_liteenc_v1_diffusefg_officialsplit_bestacc_seed42_g4
